name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint type
      description: e.g. OpenAI, OpenRouter, Ollama, a gateway. Please don't paste your key or private URLs.
  - type: input
    id: model
    attributes:
      label: Model
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys and anything private first.
